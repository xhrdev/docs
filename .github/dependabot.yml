version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    assignees:
      - skilbjo
    rebase-strategy: auto
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
      # security updates are one pr per package unless grouped explicitly;
      # `groups` above only applies to routine version updates.
      security:
        applies-to: security-updates
        patterns:
          - '*'
    versioning-strategy: increase
    open-pull-requests-limit: 5
    commit-message:
      prefix: fix
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    assignees:
      - skilbjo
    # private shared workflows; dependabot cannot read the repo
    ignore:
      - dependency-name: "xhrdev/*"
    groups:
      github-actions:
        patterns:
          - '*'
    open-pull-requests-limit: 5
    commit-message:
      prefix: fix
      include: scope
