name: pr

on:
  pull_request:
    branches:
      - master

defaults:
  run:
    shell: bash

jobs:
  build-and-test:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      pull-requests: read
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: cycjimmy/semantic-release-action@v8.1.4
        id: semantic # need an `id` for output variables
        with:
          dry_run: true
          semantic_version: 24
          extra_plugins: |
            @semantic-release/exec@6.0.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # inlined: a public repo cannot call reusable workflows stored in a private repo
  dependabot-approve-and-automerge:
    runs-on: ubuntu-slim
    timeout-minutes: 2
    needs:
      - build-and-test
    permissions:
      pull-requests: write
      contents: write
    if: ${{ github.actor == 'dependabot[bot]' }}
    steps:
      - uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      # auto-merge first, then approve: once the PR is approved and this job is its
      # only pending check, github reports it as unstable and refuses to enable
      # auto-merge. while it still waits on the review, enabling it is allowed.
      - name: Enable auto-merge for Dependabot PRs
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Approve a PR
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
