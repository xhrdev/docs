name: pr

on:
  pull_request:
    branches:
      - master

defaults:
  run:
    shell: bash

jobs:
  build-and-test:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      pull-requests: read
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: cycjimmy/semantic-release-action@v8.1.4
        id: semantic # need an `id` for output variables
        with:
          dry_run: true
          semantic_version: 24
          extra_plugins: |
            @semantic-release/exec@6.0.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependabot-approve-and-automerge:
    uses: xhrdev/actions/.github/workflows/dependabot-approve-and-automerge.yml@master
    needs:
      - build-and-test
