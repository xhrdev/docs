name: release

on:
  push:
    branches:
      - master

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 3
    permissions:
      pull-requests: write
      contents: write
      id-token: write
      issues: write
      pages: read

    outputs:
      new_release_version:   ${{ steps.semantic.outputs.new_release_version }}
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}

    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/configure-pages@v6

      - uses: cycjimmy/semantic-release-action@v8.1.4
        id: semantic # need an `id` for output variables
        with:
          semantic_version: 24
          extra_plugins: |
            @semantic-release/git@10.0.1
            @semantic-release/changelog@6.0.0
            @semantic-release/exec@6.0.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artefact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .vitepress/dist
          retention-days: 2

            #### Typescript to npm ------>
      - name: Publish to NPM
        if: steps.semantic.outputs.new_release_published == 'true'
        run: |
          # npm --no-git-tag-version version ${{ steps.semantic.outputs.new_release_version }}
          npm run npm:prepare:npm
          npm install -g npm@latest # Ensure npm 11.5.1+ for trusted publishing
          cd dist0/ && npm publish

  deploy:
    runs-on: ubuntu-slim
    timeout-minutes: 2
    needs:
      - build-and-publish
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
